---
name: Validate Gemara Catalogs

on:
  push:
    branches:
      - main
    paths:
      - ".github/threat-assessment.yaml"
      - ".github/capability-catalog.yaml"
      - ".github/workflows/gemara-catalogs.yaml"
  pull_request:
    branches:
      - main
    paths:
      - ".github/threat-assessment.yaml"
      - ".github/capability-catalog.yaml"
      - ".github/workflows/gemara-catalogs.yaml"
  workflow_dispatch:

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  validate:
    name: Validate Gemara Catalogs
    runs-on: ubuntu-latest
    permissions:
      contents: read # Clone the repository
    steps:
      - uses: step-security/harden-runner@1d88384fd173af6ecb012dfd0264a306b711241a # v2.22.4
        with:
          egress-policy: audit

      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup CUE
        uses: cue-lang/setup-cue@b0e30e540a2dae47304ebf16586a5b2db023b61c # v2.0.0
        with:
          version: v0.15.1

      # Schemas are pulled from the CUE Central Registry (registry.cue.works)
      - name: Validate Threat Assessment Catalog
        run: |
          cue vet -c -d "#ThreatCatalog" github.com/gemaraproj/gemara@v1.5.0 .github/threat-assessment.yaml

      - name: Validate Capability Catalog
        run: |
          cue vet -c -d "#CapabilityCatalog" github.com/gemaraproj/gemara@v1.5.0 .github/capability-catalog.yaml
