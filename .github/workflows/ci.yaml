---
name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  changes:
    name: Detect Changes
    runs-on: ubuntu-latest
    permissions:
      contents: read # Clone the repository and diff changed files
    outputs:
      code: ${{ steps.filter.outputs.code }}
    steps:
      - uses: step-security/harden-runner@aebdcf6156ab6691adf63218240e476564a1ed4c # v2.23.0
        with:
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - id: filter
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_REF: ${{ github.base_ref }}
        run: |
          if [ "$EVENT_NAME" = "push" ]; then
            # On push to main, always run
            echo "code=true" >> "$GITHUB_OUTPUT"
          else
            # On PR, check if any non-markdown files changed
            FILES=$(git diff --name-only "origin/$BASE_REF...HEAD" | grep -v '\.md$' || true)
            if [ -z "$FILES" ]; then
              echo "code=false" >> "$GITHUB_OUTPUT"
            else
              echo "code=true" >> "$GITHUB_OUTPUT"
            fi
          fi

  CI:
    name: CI
    needs: [changes]
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read # Clone the repository
    steps:
      - uses: step-security/harden-runner@aebdcf6156ab6691adf63218240e476564a1ed4c # v2.23.0
        with:
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version-file: go.mod

      - name: Setup GO environment
        run: |
          go mod download

      - name: Verify go.mod and go.sum tidiness
        run: |
          go mod tidy -diff

      - name: Vet
        run: |
          go vet ./...

      - name: Unit tests and coverage gate
        env:
          TESTCOVERAGE_THRESHOLD: 80
        run: |
          make test
          make test-cov

  goreleaser-snapshot:
    name: GoReleaser Snapshot
    needs: [changes]
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read # Clone the repository
    steps:
      - uses: step-security/harden-runner@aebdcf6156ab6691adf63218240e476564a1ed4c # v2.23.0
        with:
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version-file: go.mod
      - name: Run GoReleaser Snapshot
        uses: goreleaser/goreleaser-action@a4f02ab5355a589de60d917a659ce617ed19b3de # v7.3.0
        with:
          version: "~> v2"
          args: release --snapshot --clean --skip=publish,sign,announce
      - name: Verify Snapshot Artifacts
        run: |
          test -f dist/checksums.txt
          test -f dist/pvtr_Darwin_all.tar.gz
          test -f dist/pvtr_Linux_x86_64.tar.gz
          test -f dist/pvtr_Linux_arm64.tar.gz
          test -f dist/pvtr_Windows_x86_64.zip
          test -f dist/pvtr_Windows_arm64.zip
          echo "All expected release artifacts and checksums.txt were successfully generated."
