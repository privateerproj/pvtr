---
name: govulncheck

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  schedule:
    # Run weekly on Mondays at 9 AM UTC
    - cron: "0 9 * * 1"
  workflow_dispatch:

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  govulncheck:
    name: govulncheck
    runs-on: ubuntu-latest
    permissions:
      contents: read # Clone the repository
      security-events: write # Upload SARIF results to code scanning
    steps:
      - uses: step-security/harden-runner@46b06cea07f9e64621fdf066ba77ac6915163d43 # v2.22.3
        with:
          egress-policy: audit

      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod

      - name: Install govulncheck
        env:
          GOTOOLCHAIN: local
        run: |
          go version
          go install golang.org/x/vuln/cmd/govulncheck@v1.1.4
          govulncheck -version

      - name: Run govulncheck (human-readable trace)
        id: govulncheck-text
        env:
          GOTOOLCHAIN: local
        continue-on-error: true
        run: |
          govulncheck -show traces ./...

      - name: Generate SARIF report
        id: govulncheck-sarif
        if: always() && steps.govulncheck-text.outcome != 'skipped'
        env:
          GOTOOLCHAIN: local
        continue-on-error: true
        run: |
          govulncheck -format sarif ./... > govulncheck.sarif

      - name: Upload SARIF to GitHub Code Scanning
        if: always() && steps.govulncheck-sarif.outcome != 'skipped' && hashFiles('govulncheck.sarif') != ''
        uses: github/codeql-action/upload-sarif@33d7b85da1a04171e211befe2c739303b9a4c066 # v4.39.3
        with:
          sarif_file: govulncheck.sarif

      - name: Check govulncheck status
        if: always()
        run: |
          if [ "${{ steps.govulncheck-text.outcome }}" != "success" ]; then
            echo "govulncheck text scan reported vulnerabilities or failed."
            exit 1
          fi
          if [ "${{ steps.govulncheck-sarif.outcome }}" != "success" ]; then
            echo "govulncheck SARIF report generation failed."
            exit 1
          fi
